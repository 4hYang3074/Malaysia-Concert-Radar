name: Concert scan

on:
  schedule:
    # 马来西亚时间 08:17 与 20:17
    - cron: "17 0 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:
  push:
    # 扫描程序或设定改了就马上重跑一次（机器人提交的 docs/state 不会触发）
    branches: [main]
    paths: ["radar/**", "config.json", ".github/workflows/scan.yml", "state/local/**"]
  issues:
    # 提交或关闭 [线索] Issue 时马上更新一次
    types: [opened, closed, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: concert-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[线索]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR (read prices printed on seat maps)
        # 先更新软件源再装（不更新会 404 失败）；装不起来也继续扫描，只是这次不读图片文字
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-chi-tra tesseract-ocr-kor imagemagick > /dev/null && break
            sleep 15
          done

      - name: Scan
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          # 一般网页搜索（选一个放进 GitHub Secrets 就会启用；都没放就只用 Google News）
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY || secrets.SERPAPI }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python radar/scan.py

      - name: Commit
        run: |
          git config user.name "concert-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs state
          git diff --cached --quiet && exit 0
          git commit -m "Concert scan $(TZ=Asia/Kuala_Lumpur date '+%F %H:%M')"
          # 你电脑的 BookMyShow 抓取也会推送：推不上去就拉最新的再推，最多试 5 次
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null
            sleep $((i * 10))
          done
          exit 1

      - name: Notify
        if: hashFiles('data/alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "演唱会雷达 $(TZ=Asia/Kuala_Lumpur date '+%-m/%-d %H:%M')" \
            --body-file data/alert.md \
            --assignee "$GITHUB_REPOSITORY_OWNER"
