<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>演唱会雷达</title>
<meta name="theme-color" content="#121212">
<link rel="stylesheet" href="assets/app.css?v=20260929m">
<script>
  // 旧版网址（#/e/xxx）转到新的演出页
  const old = location.hash.match(/^#\/e\/(.+)$/);
  if (old) location.replace("event.html?id=" + old[1]);
</script>
</head>
<body>
<div class="wrap view">
  <form action="confirmed.html" style="margin-top:6px">
    <input class="search" name="q" type="search" placeholder="🔍 搜索明星或演出…">
    <input type="hidden" name="cat" value="all">
  </form>
  <div id="rails"></div>
  <div class="sec"><div><h2>📅 抢票日历</h2><span class="meta">未来 60 天所有已公布的开票时间（马来西亚时间）</span></div></div>
  <div class="meta" style="margin:-4px 0 10px">
    <span class="pill ok" style="margin:0">✅ 已公布</span> 售票平台已经上架
    <span class="pill warn" style="margin:0">🕒 待平台确认</span> 官方 IG 先公布，售票平台还没上架</div>
  <div id="cal"></div>
  <div id="foot"></div>
</div>
<script src="assets/app.js?v=20260929m"></script>
<script>
loadData().then(d => {
  nav(d, "home");
  const now = new Date(), c = currentCountry();
  const q = c === "ALL" ? "" : "&c=" + c;
  // 1. 即将开票：开票时间还没到（或刚开卖一天内），按开票时间排序
  const soon = d.events.filter(e => category(e, now) === "soon")
    .sort((a, b) => nextSale(a, now).start.localeCompare(nextSale(b, now).start));
  // 2. 当红歌星（华语/K-pop/欧美，还没开票的优先）
  const hot = highlights(d, now, 12);
  // 3. 最新上架（7 天内）
  const fresh = d.events.filter(e => e.first_seen && now - toDate(e.first_seen) < 7 * 864e5 && category(e, now) === "soon")
    .sort((a, b) => b.first_seen.localeCompare(a.first_seen) || (b.fans || 0) - (a.fans || 0)).slice(0, 20);
  // 3b. 新闻传出加场、平台还没公布新场次的开票时间（先留意）
  const added = d.events.filter(e => e.news_added && category(e, now) !== "soon");
  // 4. 传出要来（待确定，已认出明星的）
  const rumor = pendingGroups(d).groups.filter(g => g.leads.length).slice(0, 15);
  const groupCard = g => `<a class="pcard" href="pending.html#a-${encodeURIComponent(g.name)}">
    <div class="ph"><div class="ini">${esc(g.name.slice(0, 1))}</div>
      ${localUrl(g.photo) ? `<img src="${esc(localUrl(g.photo))}" alt="" loading="lazy" style="position:relative" onerror="this.remove()">` : ""}
      <div class="cd">🗣️ ${g.leads.length} 条消息 · ${esc(fmt(g.latest, false))}</div></div>
    <div class="t">${esc(g.name)}</div><div class="v">传出要来 · 还没开票</div><span class="tag">待确定</span></a>`;
  $("#rails").innerHTML =
    railHTML("🔥 即将开票", soon.map(e => posterCard(e, now)), "confirmed.html?cat=soon" + q) +
    railHTML("🌟 当红歌星", hot.map(i => i.ev ? posterCard(i.ev, now) : groupCard(i.group))) +
    railHTML("📢 传出加场", added.map(e => posterCard(e, now))) +
    railHTML("🆕 最新上架", fresh.map(e => posterCard(e, now)), "confirmed.html?cat=all" + q) +
    railHTML("🗣️ 传出要来", rumor.map(groupCard), "pending.html") ||
    `<div class="card empty" style="margin-top:20px">这个国家目前还没有资料。</div>`;
  $("#cal").innerHTML = calendarHTML(saleCalendar(d, now), now);
  $("#foot").innerHTML = footer(d);
}).catch(() => { nav(null, "home"); fail($("#rails")); });
</script>
</body>
</html>
