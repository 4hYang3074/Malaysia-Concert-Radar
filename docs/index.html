<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>抢票日历 · 马来西亚演唱会雷达</title>
<meta name="theme-color" content="#15171c">
<link rel="stylesheet" href="assets/app.css?v=20260929c">
<script>
  // 旧版网址（#/e/xxx）转到新的演出页
  const old = location.hash.match(/^#\/e\/(.+)$/);
  if (old) location.replace("event.html?id=" + old[1]);
</script>
</head>
<body>
<div class="wrap view">
  <h1>🌟 当红歌星动态</h1>
  <p class="lede">还没开票的排在最前面（快开卖、开票时间未公布、传出要来），其次是正在抢票、刚上架；同类再按人气（Deezer 粉丝数）排序。只列华语、K-pop、欧美歌星。</p>
  <div id="hl"></div>

  <h2 style="font-size:22px;margin-top:30px">📅 抢票日历</h2>
  <p class="lede">未来 60 天所有已公布的开票时间（包括预售，马来西亚时间）。<br>
    <span class="pill ok" style="margin:0">✅ 已公布</span> 售票平台已经上架
    <span class="pill warn" style="margin:0">🕒 待平台确认</span> 官方 IG 先公布，售票平台还没上架</p>
  <div id="cal"></div>

  <h2>浏览全部</h2>
  <div class="doors" id="doors" style="margin-top:0"></div>
  <div id="foot"></div>
</div>
<script src="assets/app.js?v=20260929c"></script>
<script>
loadData().then(d => {
  nav(d, "home");
  const now = new Date();
  $("#hl").innerHTML = highlightsHTML(highlights(d, now));
  $("#cal").innerHTML = calendarHTML(saleCalendar(d, now), now);
  const withPhoto = d.events.filter(e => e.avatar_kind === "artist").slice(0, 7);
  $("#doors").innerHTML = `
    <a class="door ok" href="confirmed.html">
      <div class="t">✅ 已确定的演唱会</div>
      <div class="big">${d.events.length}</div>
      <div class="d">已经在官方售票平台上架，按售票时间分类，可以看票价和座位图。</div>
      <div class="stack">${withPhoto.map(e => avatar(e.avatar, e.artist_name, 40, e.avatar_kind)).join("")}</div>
      <div class="go">查看 →</div>
    </a>
    <a class="door wait" href="pending.html">
      <div class="t">🕒 待确定的消息</div>
      <div class="big">${d.pending.length}</div>
      <div class="d">官方 IG、新闻或你提交的线索提到，但售票平台还没上架。按明星整理。</div>
      <div class="stack">${pendingGroups(d).groups.filter(g => g.photo).slice(0, 8).map(g => avatar(g.photo, g.name, 40)).join("")}</div>
      <div class="go">查看 →</div>
    </a>`;
  $("#foot").innerHTML = footer(d);
}).catch(() => { nav(null, "home"); fail($("#cal")); });
</script>
</body>
</html>
