<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>马来西亚演唱会雷达</title>
<meta name="theme-color" content="#16181d">
<style>
:root {
  --bg: #f5f5f7; --card: #fff; --ink: #16181d; --sub: #5f6470; --line: #e3e4e8;
  --btn: #2b2e35; --btn-ink: #fff; --chip: #eceef2;
  --ok: #1f8a4c; --ok-bg: #e6f5ec; --warn: #b26a00; --warn-bg: #fff3dd;
  --bad: #c0392b; --bad-bg: #fdecea; --info: #2459c7; --info-bg: #e8effd;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --card: #1b1e24; --ink: #eceef2; --sub: #9aa0ab; --line: #2c3038;
    --btn: #dcdde2; --btn-ink: #16181d; --chip: #262a31;
    --ok: #5fd08f; --ok-bg: #173123; --warn: #f0b458; --warn-bg: #33270f;
    --bad: #f08276; --bad-bg: #3a1c19; --info: #8db1ff; --info-bg: #1b2640;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
a { color: var(--info); }
.wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 60px; }
h1 { font-size: 22px; margin: 4px 0 2px; }
.meta { color: var(--sub); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
h2 { font-size: 17px; margin: 26px 0 10px; }
h3 { font-size: 14px; color: var(--sub); margin: 20px 0 8px; font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.timeline .row { display: grid; grid-template-columns: 118px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.timeline .row:first-child { border-top: 0; }
.when { font-weight: 600; font-size: 13.5px; }
.when small { display: block; font-weight: 400; color: var(--sub); }
.cd { font-size: 12.5px; color: var(--warn); white-space: nowrap; }
.cd.live { color: var(--ok); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; }
.filters input[type=search] { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; }
.fbtn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.fbtn.on { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
a.ev { display: block; text-decoration: none; color: inherit; margin: 0; transition: border-color .15s, transform .15s; }
a.ev:hover { border-color: var(--sub); transform: translateY(-1px); }
.ev-title { font-weight: 650; font-size: 15.5px; overflow-wrap: anywhere; }
.ev-sub { color: var(--sub); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.badge { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: var(--chip); color: var(--sub); margin-right: 4px; vertical-align: 1px; }
.badge.new { background: var(--info-bg); color: var(--info); }
.status { margin-top: 8px; font-size: 13.5px; font-weight: 600; }
.status.ok { color: var(--ok); } .status.warn { color: var(--warn); } .status.bad { color: var(--bad); } .status.sub { color: var(--sub); font-weight: 500; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
th { color: var(--sub); font-weight: 500; font-size: 12.5px; border-top: 0; }
td.price { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.pricetable tr:nth-child(even) td { background: var(--bg); }
.soldout { color: var(--bad); font-size: 12px; font-weight: 600; }
.note { white-space: pre-line; font-size: 13.5px; color: var(--sub); background: var(--bg); border-radius: 8px; padding: 10px 12px; margin: 4px 0; }
details summary { cursor: pointer; font-size: 14px; margin: 8px 0; }
.maps img { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: block; }
.btn { display: inline-block; background: var(--btn); color: var(--btn-ink); text-decoration: none; padding: 10px 16px; border-radius: 10px; font-size: 14.5px; font-weight: 600; margin: 10px 8px 0 0; border: 0; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); text-decoration: none; font-size: 14px; padding: 6px 10px 6px 4px; border-radius: 8px; }
.back:hover { background: var(--chip); }
.hero h1 { font-size: 21px; margin: 10px 0 6px; overflow-wrap: anywhere; }
.hero .status { font-size: 15px; }
.lead { padding: 10px 0; border-top: 1px solid var(--line); }
.lead:first-child { border-top: 0; }
.lead .t { font-weight: 600; overflow-wrap: anywhere; }
.lead ul { margin: 4px 0 0; padding-left: 18px; color: var(--sub); font-size: 13px; }
.tag-ok { color: var(--ok); font-size: 12.5px; } .tag-new { color: var(--warn); font-size: 12.5px; font-weight: 600; }
.empty { color: var(--sub); font-size: 14px; padding: 6px 0; }
footer { color: var(--sub); font-size: 12.5px; margin-top: 30px; line-height: 1.7; }
.hide { display: none !important; }
.view { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (max-width: 600px) {
  .timeline .row { grid-template-columns: 92px minmax(0, 1fr); }
  .timeline .row .cd { grid-column: 2; }
}
</style>
</head>
<body>
<div class="wrap">

<!-- 首页：演出列表 -->
<div id="listView" class="view">
  <h1>🎤 马来西亚演唱会雷达</h1>
  <div class="meta" id="meta">载入中…</div>
  <div class="chips" id="health"></div>

  <h2>⏰ 未来 7 天的售票节点</h2>
  <div class="card timeline" id="timeline"></div>

  <h2>🎫 选一场演唱会 <span class="meta" id="count"></span></h2>
  <div class="filters">
    <input type="search" id="q" placeholder="搜索艺人、演出、场馆…">
  </div>
  <div class="chips" id="srcFilter"></div>
  <div class="chips" id="cityFilter" style="margin-bottom:12px"></div>
  <div class="grid" id="events"></div>

  <h2>📣 最新消息 <span class="meta">（IG 官方账号、标签、新闻、你提交的线索）</span></h2>
  <div class="chips" id="leadFilter"></div>
  <div class="card" id="leads"></div>

  <footer id="foot"></footer>
</div>

<!-- 详细页：单场演出 -->
<div id="detailView" class="view hide"></div>

</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";
const localUrl = u => /^maps\/[\w./-]+$/.test(u || "") ? u : "#";   // 座位图只允许仓库里的本地路径
const toDate = s => s ? new Date(s.replace(" ", "T") + ":00+08:00") : null;   // 资料里的时间都是马来西亚时间
const WD = "日一二三四五六";
const fmt = s => { const d = toDate(s); if (!d) return ""; const m = new Date(d.getTime() + 8 * 3600e3);
  return `${m.getUTCMonth() + 1}/${m.getUTCDate()}（${WD[m.getUTCDay()]}）${s.slice(11)}`; };
const fmtDay = s => fmt(s).replace(/\s?\d\d:\d\d$/, "");
const REPO = "4hYang3074/Malaysia-Concert-Radar";
function countdown(target, now) {
  const ms = target - now;
  if (ms <= 0) return "";
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return d ? `${d} 天 ${h} 小时后` : h ? `${h} 小时 ${mm} 分后` : `${mm} 分钟后`;
}

let DATA, BYID = {}, LEADS_BY_EVENT = {}, state = {q: "", src: "全部", city: "全部", kind: "全部"};

function saleState(e, now) {
  // 算出“下一步要做什么”
  if (e.sold_out) return {cls: "bad", text: "已售罄"};
  if (e.stop_sales) return {cls: "bad", text: "已停止售票"};
  const rounds = (e.sales || []).filter(s => s.start || s.end);
  const upcoming = rounds.filter(s => s.start && toDate(s.start) > now).sort((a, b) => a.start.localeCompare(b.start));
  const open = rounds.filter(s => s.available && (!s.start || toDate(s.start) <= now) && (!s.end || toDate(s.end) > now));
  if (upcoming.length) {
    const s = upcoming[0];
    return {cls: "warn", text: `${s.name || "开售"}：${fmt(s.start)} 开始（${countdown(toDate(s.start), now)}）${s.code_required ? " · 需要预售码" : ""}`};
  }
  if (open.length && e.source === "GoLive") return {cls: "ok", text: `售票中（${open.map(s => s.name).join("、")}）· 余票以官网为准`};
  if (e.source === "Ticket2U") {
    const end = rounds.find(s => s.end);
    return {cls: "ok", text: `售票中${end ? `，${fmt(end.end)} 截止` : ""} · 余票以官网为准`};
  }
  if (e.source === "BookMyShow") return {cls: "sub", text: "已在 BookMyShow 上架（开售时间请看官网）"};
  return {cls: "sub", text: "售票时间未公布"};
}

function badges(e, now) {
  const recent = t => t && (now - toDate(t)) < 3 * 864e5;
  return (recent(e.first_seen) ? '<span class="badge new">新</span>' : "") +
    (recent(e.updates?.prices) ? '<span class="badge new">🆕 票价刚公布</span>' : "") +
    (recent(e.updates?.maps) ? '<span class="badge new">🆕 座位图更新</span>' : "");
}

// ---------- 首页 ----------

function timeline(now) {
  const soon = now.getTime() + 7 * 864e5, items = [];
  for (const e of DATA.events) for (const s of e.sales || []) {
    for (const [k, label] of [["queue", "排队开放"], ["start", "开售"], ["end", "截止"]]) {
      const t = toDate(s[k]);
      if (!t || t < now - 3 * 3600e3 || t > soon) continue;
      if (k === "end" && e.source !== "Ticket2U") continue;
      items.push({t, s: s[k], e, label: `${s.name || ""} ${label}`.trim(), code: s.code_required});
    }
  }
  items.sort((a, b) => a.t - b.t);
  $("#timeline").innerHTML = items.length ? items.map(i => `
    <a class="row" href="#/e/${encodeURIComponent(i.e.id)}">
      <div class="when">${fmtDay(i.s)}<small>${i.s.slice(11)}</small></div>
      <div><div class="ev-title" style="font-size:14px">${esc(i.e.name)}</div>
        <div class="ev-sub">${esc(i.label)}${i.code ? " · 需要预售码" : ""} · ${esc(i.e.source)}</div></div>
      <div class="cd ${i.t <= now ? "live" : ""}">${i.t <= now ? "进行中" : countdown(i.t, now)}</div>
    </a>`).join("") : `<div class="empty">未来 7 天没有已公布的开售或截止时间。</div>`;
}

function listCard(e, now) {
  const st = saleState(e, now);
  const dates = e.dates.length ? e.dates.map(fmtDay).join("、") : "日期未公布";
  return `<a class="card ev" href="#/e/${encodeURIComponent(e.id)}">
    <div class="ev-title">${badges(e, now)}${esc(e.name)}</div>
    <div class="ev-sub"><span class="badge">${esc(e.source)}</span>${esc(dates)}</div>
    <div class="ev-sub">📍 ${esc(e.venue || "场馆未公布")}${e.city ? " · " + esc(e.city) : ""}</div>
    <div class="status ${st.cls}">${esc(st.text)}</div>
  </a>`;
}

function renderEvents(now) {
  const q = state.q.trim().toLowerCase();
  const list = DATA.events.filter(e =>
    (state.src === "全部" || e.source === state.src) &&
    (state.city === "全部" || (e.city || "其他") === state.city) &&
    (!q || `${e.name} ${e.artist || ""} ${e.venue || ""} ${e.city || ""}`.toLowerCase().includes(q)));
  $("#count").textContent = `${list.length} 场`;
  $("#events").innerHTML = list.length ? list.map(e => listCard(e, now)).join("") : `<div class="card empty">没有符合条件的演出。</div>`;
}

function leadRow(l) {
  const linked = (l.matches || []).map(m => BYID[m]).filter(Boolean);
  return `<div class="lead">
    <div class="ev-sub"><span class="badge">${esc(l.kind)}</span>${esc(l.from)}${l.from_name ? "（" + esc(l.from_name) + "）" : ""} · ${esc(fmt(l.time) || l.first_seen)}</div>
    <div class="t"><a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.title)}</a></div>
    ${(l.hints || []).length ? `<ul>${l.hints.map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
    ${linked.length ? `<div class="tag-ok">✓ 已在售票平台：${linked.map(e => `<a href="#/e/${encodeURIComponent(e.id)}">${esc(e.name)}</a>`).join("、")}</div>`
      : l.kind === "新闻" ? "" : `<div class="tag-new">待确认：售票平台还没有对应的演出</div>`}
  </div>`;
}

function renderLeads() {
  const list = DATA.leads.filter(l => state.kind === "全部" || l.kind === state.kind);
  $("#leads").innerHTML = list.length ? list.slice(0, 80).map(leadRow).join("") : `<div class="empty">目前没有消息。</div>`;
}

function filterChips(el, values, key, render) {
  el.innerHTML = values.map(v => `<button class="fbtn ${state[key] === v ? "on" : ""}" data-v="${esc(v)}">${esc(v)}</button>`).join("");
  el.onclick = ev => { const b = ev.target.closest("button"); if (!b) return; state[key] = b.dataset.v; filterChips(el, values, key, render); render(new Date()); };
}

function renderList() {
  const now = new Date();
  $("#meta").textContent = `最后扫描：${DATA.generated_at}（马来西亚时间）· 每天 08:17、20:17 自动更新`;
  const stale = (now - toDate(DATA.generated_at)) > 26 * 3600e3;
  $("#health").innerHTML = (stale ? `<span class="chip bad">⚠️ 超过 26 小时没有更新</span>` : "") +
    Object.entries(DATA.health).map(([k, v]) => `<span class="chip ${v.ok ? (v.stale ? "warn" : "ok") : "bad"}" title="${esc(v.error || "")}">${v.ok ? (v.stale ? "⏸" : "✓") : "✕"} ${esc(k)}${v.count != null ? " " + v.count : ""}${v.stale ? "（沿用上次）" : ""}</span>`).join("");
  timeline(now);
  filterChips($("#srcFilter"), ["全部", ...new Set(DATA.events.map(e => e.source))], "src", renderEvents);
  const cities = [...new Set(DATA.events.map(e => e.city || "其他"))].sort();
  filterChips($("#cityFilter"), ["全部", ...cities], "city", renderEvents);
  filterChips($("#leadFilter"), ["全部", ...new Set(DATA.leads.map(l => l.kind))], "kind", renderLeads);
  renderEvents(now);
  renderLeads();
  $("#foot").innerHTML = `
    <div><b>资料来源</b>：GoLive、Ticket2U、BookMyShow 的公开资料；IG 通过 Meta 官方 API 读取 ${DATA.ig_accounts.map(a => "@" + esc(a)).join("、")}，以及标签 ${DATA.hashtags.map(t => "#" + esc(t)).join("、")}；新闻来自 Google News。</div>
    ${DATA.ig_bad.length ? `<div>⚠️ 这些 IG 账号/标签这次读不到（可能账号名错误或不是商业账号）：${DATA.ig_bad.map(b => esc(b.account)).join("、")}</div>` : ""}
    <div>票价、余票以官网为准；“售票中”只代表在售票期间内，不保证还有票。</div>
    <div><a class="btn ghost" href="https://github.com/${REPO}/issues/new?template=lead.yml" target="_blank" rel="noopener">＋ 提交线索（例如小红书链接）</a>
    <a class="btn ghost" href="https://github.com/${REPO}/actions" target="_blank" rel="noopener">扫描记录</a></div>`;
}

// ---------- 详细页 ----------

function renderDetail(id) {
  const e = BYID[id], now = new Date();
  if (!e) {
    $("#detailView").innerHTML = `<a class="back" href="#">‹ 返回列表</a><div class="card empty" style="margin-top:10px">找不到这场演出，可能已经结束或下架了。</div>`;
    return;
  }
  document.title = `${e.name} · 马来西亚演唱会雷达`;
  const st = saleState(e, now);
  const tiers = e.tiers || [];
  const maps = (e.seat_maps || []).map(localUrl).filter(u => u !== "#");
  const salesRows = (e.sales || []).filter(s => s.start || s.end || s.queue);
  const rel = LEADS_BY_EVENT[e.id] || [];
  const fee = e.source === "GoLive" || e.source === "Ticket2U" ? "（价格未含手续费）" : "";
  $("#detailView").innerHTML = `
    <a class="back" href="#">‹ 返回列表</a>
    <div class="card hero" style="margin-top:8px">
      <div>${badges(e, now)}<span class="badge">${esc(e.source)}</span>${e.type ? `<span class="badge">${esc(e.type)}</span>` : ""}</div>
      <h1>${esc(e.name)}</h1>
      <div class="ev-sub">📅 ${esc(e.dates.length ? e.dates.map(fmt).join("、") : "日期未公布")}</div>
      <div class="ev-sub">📍 ${esc(e.venue || "场馆未公布")}${e.city ? " · " + esc(e.city) : ""}</div>
      ${e.organiser ? `<div class="ev-sub">🏢 主办：${esc(e.organiser)}</div>` : ""}
      <div class="status ${st.cls}">${esc(st.text)}</div>
      <a class="btn" href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener">到 ${esc(e.source)} 购票 ↗</a>
    </div>

    ${salesRows.length ? `<h3>⏰ 售票时间</h3><div class="card"><table>
      <tr><th>轮次</th><th>开始</th><th>结束</th></tr>
      ${salesRows.map(s => `<tr><td>${esc(s.name || "")}${s.code_required ? "<br><small>需要预售码</small>" : ""}${s.queue ? `<br><small>排队开放 ${esc(fmt(s.queue))}</small>` : ""}</td>
        <td>${esc(fmt(s.start) || "—")}</td><td>${esc(fmt(s.end) || "未公布")}</td></tr>`).join("")}
    </table></div>` : ""}

    <h3>💺 座位图与票价${fee}</h3>
    <div class="card">
      ${maps.length ? `<div class="maps">${maps.map(u =>
        `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="官方座位图" onerror="this.closest('a').outerHTML='<div class=empty>图片载入失败，请到官网查看。</div>'"></a>`).join("")}
        <div class="meta" style="margin:6px 0 12px">官方座位图（来源：${esc(e.source)}，点图可放大）</div></div>`
        : `<div class="empty" style="margin-bottom:10px">官方座位图还没公布，公布后会自动加上并通知你。</div>`}
      ${tiers.length ? `<table class="pricetable"><tr><th>票区</th><th style="text-align:right">价格</th></tr>
        ${tiers.map(t => `<tr><td>${esc(t.name)}${t.desc ? ` <small>· ${esc(t.desc)}</small>` : ""}${t.sold_out ? ' <span class="soldout">售罄</span>' : ""}</td><td class="price">${esc(t.price || "—")}</td></tr>`).join("")}</table>`
        : e.price_text ? `<div class="note">${esc(e.price_text)}</div>`
        : e.price_from ? `<div class="note">最低 ${esc(e.price_from)} 起（详细票区请看官网）</div>`
        : `<div class="note">${maps.length ? "官方还没有用文字公布票价（目前只有座位图）。文字票价一公布，这里会自动变成价格表，并通知你。" : "票价还没公布，公布后会自动更新并通知你。"}</div>`}
    </div>

    ${e.limit ? `<h3>🎟 限购</h3><div class="card">每笔交易最多 <b>${e.limit}</b> 张</div>` : ""}

    ${Object.keys(e.notes || {}).length ? `<h3>📋 购票须知（官网原文）</h3><div class="card">${Object.entries(e.notes).map(([k, v]) =>
      `<details><summary>${esc(k)}</summary><div class="note">${esc(v)}</div></details>`).join("")}</div>` : ""}

    <h3>📣 相关消息</h3>
    <div class="card">${rel.length ? rel.slice(0, 10).map(leadRow).join("") : `<div class="empty">目前没有 IG 或新闻提到这场演出。</div>`}</div>

    <div class="meta" style="margin-top:14px">首次发现：${esc(e.first_seen || "")} · 最后扫描：${esc(DATA.generated_at)}</div>`;
}

// ---------- 路由：#/e/<id> 是详细页，其余是首页 ----------

let listScroll = 0;
function route() {
  const m = location.hash.match(/^#\/e\/(.+)$/);
  if (m) {
    if (!$("#listView").classList.contains("hide")) listScroll = scrollY;
    $("#listView").classList.add("hide");
    $("#detailView").classList.remove("hide");
    renderDetail(decodeURIComponent(m[1]));
    scrollTo(0, 0);
  } else {
    document.title = "马来西亚演唱会雷达";
    $("#detailView").classList.add("hide");
    $("#listView").classList.remove("hide");
    renderEvents(new Date());
    scrollTo(0, listScroll);
  }
}

$("#q").addEventListener("input", ev => { state.q = ev.target.value; renderEvents(new Date()); });
window.addEventListener("hashchange", route);

fetch("data.json?" + Date.now()).then(r => r.json()).then(d => {
  DATA = d;
  BYID = Object.fromEntries(d.events.map(e => [e.id, e]));
  for (const l of d.leads) for (const m of l.matches || []) (LEADS_BY_EVENT[m] ||= []).push(l);
  renderList();
  route();
  setInterval(() => { if (location.hash.startsWith("#/e/")) return; timeline(new Date()); }, 60000);
}).catch(() => { $("#meta").textContent = "资料载入失败，请稍后再试。"; });
</script>
</body>
</html>
