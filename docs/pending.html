<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>待确定的消息 · 马来西亚演唱会雷达</title>
<meta name="theme-color" content="#15171c">
<link rel="stylesheet" href="assets/app.css?v=20260929m">
</head>
<body>
<div class="wrap view">
  <h1>🕒 待确定的消息</h1>
  <p class="lede">明星或主办在 IG、新闻里说要来马来西亚，但售票平台还没上架。按明星整理，上架后会自动移到“已确定”，并通知你。</p>
  <div class="segs" id="segs"></div>
  <div class="list" id="list"></div>
  <a class="btn ghost" href="https://github.com/4hYang3074/Malaysia-Concert-Radar/issues/new?template=lead.yml" target="_blank" rel="noopener">＋ 我看到一个消息（例如小红书），提交给雷达</a>
  <div id="foot"></div>
</div>
<script src="assets/app.js?v=20260929m"></script>
<script>
const ICON = {"IG": "📸", "新闻": "📰", "人工": "✋"};
const leadRow = l => `
  <a class="mini" href="lead.html?id=${encodeURIComponent(l.id)}">
    <span class="k">${ICON[l.kind] || "•"}</span>
    <span class="t">${esc(l.title)}<small>${esc(l.from)} · ${esc(fmt(l.time) || l.first_seen)}</small></span>
  </a>`;

let DATA;
function artistCard(g) {
  const s = artistSummary(g);
  const n = g.leads.length;
  // 这位明星已经有演出在售票平台上架（例如关注名单里的明星）
  const live = DATA.events.filter(e => e.artist_name && e.artist_name.toLowerCase() === g.name.toLowerCase());
  return `<div class="card artist" id="a-${encodeURIComponent(g.name)}">
    <div class="ahead">
      ${avatar(g.photo, g.name, 64)}
      <div class="body">
        <div class="name">${esc(g.name)} ${g.watched ? '<span class="badge new">⭐ 关注中</span>' : ""}</div>
        <div class="info">${n ? `${n} 条消息 · 最新 ${esc(fmt(g.latest, false) || g.latest)} · ${s.src.map(esc).join("、")}` : live.length ? "目前没有其他待确定的新消息" : "暂时没有新消息，一有 IG 或新闻提到就会出现在这里"}</div>
      </div>
    </div>
    ${live.map(e => `<a class="banner ok" style="display:block;text-decoration:none" href="event.html?id=${encodeURIComponent(e.id)}">✅ 已在 ${platformsOf(e).map(p => esc(p.source)).join("、")} 上架：${esc(e.name)} →</a>`).join("")}
    ${s.platforms.length ? `<div class="sum ok" style="margin-top:8px">🎫 公告提到的售票平台：<b>${s.platforms.map(esc).join("、")}</b></div>` : ""}
    ${newsCheckHTML((DATA.news_checks || {})[g.name])}
    ${s.sales.length ? `<div class="sum warn">🎟️ ${s.sales.map(esc).join("<br>🎟️ ")}</div>` : ""}
    ${s.points.length ? `<ul class="hints sum-list">${s.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
    ${s.images.length ? `<div class="shots">${s.images.map(l => `<a href="lead.html?id=${encodeURIComponent(l.id)}"><img src="${esc(localUrl(l.image))}" alt="" loading="lazy" onerror="this.parentNode.remove()"></a>`).join("")}</div>` : ""}
    ${n ? `<div class="minis">${g.leads.slice(0, 3).map(leadRow).join("")}</div>` : ""}
    ${n > 3 ? `<details><summary>再看 ${n - 3} 条</summary><div class="minis">${g.leads.slice(3).map(leadRow).join("")}</div></details>` : ""}
  </div>`;
}

loadData().then(d => {
  DATA = d;
  nav(d, "pending");
  const {groups, other} = pendingGroups(d);
  $("#segs").innerHTML = groups.map(g => `<a class="seg" href="#a-${encodeURIComponent(g.name)}">${esc(g.name)}<b>${g.leads.length}</b></a>`).join("")
    + (other.length ? `<a class="seg" href="#other">其他<b>${other.length}</b></a>` : "");
  $("#list").innerHTML = groups.map(artistCard).join("") + (other.length ? `
    <div class="card artist" id="other">
      <div class="name" style="font-weight:700;font-size:17px">🗂️ 其他消息</div>
      <div class="info" style="color:var(--sub);font-size:13px">还没认出是哪位明星的消息</div>
      <div class="minis">${other.slice(0, 5).map(leadRow).join("")}</div>
      ${other.length > 5 ? `<details><summary>再看 ${other.length - 5} 条</summary><div class="minis">${other.slice(5, 100).map(leadRow).join("")}</div></details>` : ""}
    </div>` : "")
    || `<div class="card empty">目前没有待确定的消息。</div>`;
  // 被过滤掉的消息和原因（方便检查有没有过滤错）
  const hid = (d.filteredLeads || []).slice().sort((a, b) => (a.hidden || "").localeCompare(b.hidden || ""));
  $("#foot").innerHTML = (hid.length ? `
    <details class="group" style="margin-top:26px">
      <summary><h2 style="display:inline;margin:0;font-size:15px">🧹 已过滤 ${hid.length} 条消息 <span class="meta">（点开查看原因）</span></h2></summary>
      <div class="card" style="margin-top:10px"><table>
        <tr><th>消息</th><th>过滤原因</th></tr>
        ${hid.map(l => `<tr><td><a href="lead.html?id=${encodeURIComponent(l.id)}">${esc(l.title)}</a><br><small class="meta">${esc(l.from)}${l.artist ? " · " + esc(l.artist) : ""}</small></td>
          <td class="meta">${esc(l.hidden)}</td></tr>`).join("")}
      </table></div>
    </details>` : "") + footer(d);
}).catch(() => { nav(null, "pending"); fail($("#list")); });
</script>
</body>
</html>
