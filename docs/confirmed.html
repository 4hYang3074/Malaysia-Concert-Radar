<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>已确定的演唱会 · 马来西亚演唱会雷达</title>
<meta name="theme-color" content="#15171c">
<link rel="stylesheet" href="assets/app.css?v=20261005b">
</head>
<body>
<div class="wrap view">
  <h1>✅ 已确定的演唱会</h1>
  <p class="lede" id="desc">按售票时间分类，点明星看详细资料。</p>
  <div class="segs" id="segs"></div>
  <input class="search" id="q" type="search" placeholder="搜索明星、演出、场馆或城市…">
  <div class="list" id="list"></div>
  <div id="foot"></div>
</div>
<script src="assets/app.js?v=20261005b"></script>
<script>
loadData().then(d => {
  nav(d, "confirmed");
  const now = new Date();
  // 歌星筛选（华语 / 欧美 / K-pop，其他要很红）已经在 loadData 里统一做好
  const pool = d.events;
  const allRegions = false;
  const byCat = {all: pool};
  for (const c of CATS) byCat[c.key] = pool.filter(e => category(e, now) === c.key);
  // 默认打开“全部”
  let cat = qs("cat");
  if (!byCat[cat]) {
    cat = "all";
    history.replaceState(null, "", "confirmed.html?cat=" + cat);
  }
  // 顺序：全部在最前、即将开售在最后
  const tabs = [{key: "all", icon: "📋", label: "全部", desc: "所有已上架的演出：还没开票的排在前面，已经开票的收在下面。"}, ...CATS.filter(c => c.key !== "soon"), CATS.find(c => c.key === "soon")];
  $("#segs").innerHTML = tabs.map(c => `<a class="seg ${c.key === cat ? "on" : ""}" href="confirmed.html?cat=${c.key}${allRegions ? "&r=all" : ""}">${c.icon} ${c.label}<b>${byCat[c.key].length}</b></a>`).join("");
  $("#desc").textContent = tabs.find(c => c.key === cat).desc;
  document.querySelector(".seg.on")?.scrollIntoView({inline: "center", block: "nearest"});

  // GoLive 风格海报网格；选“全部国家”时，每一段再按国家分组（🇲🇾 → 🇸🇬 → 🇰🇷）
  const grid = list => `<div class="pgrid">${list.map(e => posterCard(e, now)).join("")}</div>`;
  const byCountryHTML = list => {
    if (currentCountry() !== "ALL") return grid(list);
    return Object.entries(COUNTRIES).map(([k, label]) => {
      const part = list.filter(e => (e.country || "MY") === k);
      return part.length ? `<h3 style="font-size:16px;color:var(--ink);margin:18px 0 10px">${label} <span class="meta">${part.length} 场</span></h3>${grid(part)}` : "";
    }).join("");
  };

  function render() {
    const q = $("#q").value.trim().toLowerCase();
    const match = e => !q || `${e.artist_name} ${e.name} ${e.venue || ""} ${e.city || ""}`.toLowerCase().includes(q);
    if (cat === "all") {
      // “全部”分两段：还没开票的在前面展开（即将开售按开票时间，其次是未公布）；已经开票的收起
      const notYet = sortFor("soon", byCat.soon.filter(match), now);  // 只放验证过、未来确定要开票的
      const done = sortFor("all", [...byCat.opened, ...byCat.soldout, ...byCat.tba].filter(match), now);
      $("#list").innerHTML = `
        <details class="group" open style="margin-top:4px">
          <summary><h2 style="display:inline;margin:0">🔜 还没开票 <span class="meta">${notYet.length} 场</span></h2></summary>
          <div style="margin-top:10px">${notYet.length ? byCountryHTML(notYet) : `<div class="card empty">${q ? "没有符合搜索的演出。" : "目前没有还没开票的演出。"}</div>`}</div>
        </details>
        <details class="group" ${q && !notYet.length ? "open" : ""}>
          <summary><h2 style="display:inline;margin:0">✔️ 已开票 / 已结束 <span class="meta">${done.length} 场</span></h2></summary>
          <div style="margin-top:10px">${done.length ? byCountryHTML(done) : `<div class="card empty">没有符合的演出。</div>`}</div>
        </details>`;
      return;
    }
    const list = sortFor(cat, byCat[cat].filter(match), now);
    $("#list").innerHTML = list.length ? byCountryHTML(list) : `<div class="card empty">${q ? "没有符合搜索的演出。"
      : cat === "soon" ? `售票平台上暂时没有“已公布开售时间、还没开卖”的演出。<br>官方 IG 先公布的开售时间，请看 <a href="index.html">📅 抢票日历</a>。`
      : "这一类目前没有演出。"}</div>`;
  }
  $("#q").value = qs("q") || "";  // 首页搜索框带过来的关键字
  $("#q").addEventListener("input", render);
  render();
  // 被过滤掉的演出和原因（方便检查有没有过滤错）
  const hid = (d.filtered || []).slice().sort((a, b) => (a.hidden || "").localeCompare(b.hidden || ""));
  $("#foot").innerHTML = (hid.length ? `
    <details class="group" style="margin-top:26px">
      <summary><h2 style="display:inline;margin:0;font-size:15px">🧹 已过滤 ${hid.length} 场 <span class="meta">（点开查看原因）</span></h2></summary>
      <div class="card" style="margin-top:10px"><table>
        <tr><th>演出</th><th>过滤原因</th></tr>
        ${hid.map(e => `<tr><td><a href="event.html?id=${encodeURIComponent(e.id)}">${flag(e.country || "MY")} ${esc(e.artist_name)}</a><br><small class="meta">${esc(e.name)}</small></td>
          <td class="meta">${esc(e.hidden || "")}</td></tr>`).join("")}
      </table></div>
    </details>` : "") + footer(d);
}).catch(() => { nav(null, "confirmed"); fail($("#list")); });
</script>
</body>
</html>
