<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>演出详情 · 马来西亚演唱会雷达</title>
<meta name="theme-color" content="#15171c">
<link rel="stylesheet" href="assets/app.css?v=20260929q">
</head>
<body>
<div class="wrap view" id="app"></div>
<script src="assets/app.js?v=20260929q"></script>
<script>
loadData(false).then(d => {
  nav(d, "confirmed");
  const e = d.byId[qs("id")];
  if (!e) { location.replace("confirmed.html"); return; }   // 找不到（已结束或下架）就回列表
  const now = new Date();
  const cat = category(e, now), st = status(e, now);
  document.title = `${e.artist_name} · 马来西亚演唱会雷达`;
  const tiers = e.tiers || [], ocr = e.ocr_tiers || [];
  const maps = (e.seat_maps || []).map(localUrl).filter(Boolean);
  const sales = (e.sales || []).filter(s => s.start);
  const rel = d.leadsByEvent[e.id] || [];
  const fee = e.source === "GoLive" || e.source === "Ticket2U" ? "（价格未含手续费）" : "";
  const next = nextSale(e, now);

  $("#app").innerHTML = `
    <a class="back" href="confirmed.html?cat=${cat}">‹ 返回${esc(CATS.find(c => c.key === cat).label)}</a>
    <div class="card hero" style="margin-top:6px">
      ${avatar(e.avatar, e.artist_name, 120, e.avatar_kind)}
      <h1>${esc(e.artist_name)}</h1>
      <div class="sub">${esc(e.name)}</div>
      <div style="margin-top:8px"><span class="badge">${COUNTRIES[e.country || "MY"] || ""}</span>${badges(e, now)}${platformBadges(e)}</div>
      <div class="facts">
        <div class="fact"><div class="k">📅 演出日期</div><div class="v">${e.dates.length ? e.dates.map(s => esc(fmt(s))).join("<br>") : "未公布"}</div></div>
        <div class="fact"><div class="k">📍 场馆</div><div class="v">${esc(e.venue || "未公布")}${e.city ? `<br><small>${esc(e.city)}</small>` : ""}</div></div>
        <div class="fact"><div class="k">⏰ 下一个售票节点</div><div class="v">${next ? `${esc(next.name || "开售")}<br>${esc(fmt(next.start))}` : esc(st.short || st.text)}</div></div>
        ${e.limit ? `<div class="fact"><div class="k">🎟 限购</div><div class="v">每笔最多 ${e.limit} 张</div></div>` : ""}
      </div>
      ${saleStateHTML(e)}
      <div class="banner ${st.cls}">${esc(st.text)}${e.opened_at && cat !== "soon" ? ` · ${esc(openedText(e))}` : ""}</div>
      ${e.watch ? `<div class="meta" style="margin-top:6px">🔁 监控中：${esc(e.watch.since)} 起已重新查证 ${e.watch.checks} 次（官方图片 + 平台 + Google 新闻），一查到开票资料就通知你。</div>` : ""}
      ${(() => {  // 加场消息：这位艺人所有地区的加场状态
        const same = (addedGroups(d).find(g => g.some(x => x.id === e.id)) || []);
        if (!same.length) return "";
        return `<div class="banner warn" style="text-align:left">➕ <b>加场消息</b>${same.map(x => `<div style="margin-top:6px">${flag(x.country || "MY")} <b>${esc(ADDED_LABEL[x.added_status])}</b> · ${esc(x.venue || "")} · ${esc(dateRange(x.dates))}
          ${x.added_status === "rumor" ? "（新闻说要加场，平台还没上架新场次）" : "（平台已上架加场的场次）"}
          ${x.news_added ? `<br><small>📰 <a href="${esc(safeUrl(x.news_added.url))}" target="_blank" rel="noopener">${esc(x.news_added.title)}</a>（${esc(x.news_added.time || "")}）</small>` : ""}
          ${x.id !== e.id ? ` <a href="event.html?id=${encodeURIComponent(x.id)}">查看 ›</a>` : ""}</div>`).join("")}</div>`;
      })()}
      <div class="meta" style="margin-top:14px">${platformsOf(e).length > 1 ? `这场演出在 ${platformsOf(e).length} 个官方平台售票：` : "官方售票平台："}</div>
      <div class="buybtns">${platformsOf(e).map(p => `<a class="btn ${p.sold_out ? "sold" : ""}" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">
        ${esc(p.source)}${p.sold_out ? "（售罄）" : ""}${p.price_from ? ` · ${esc(p.price_from)} 起` : ""} ↗</a>`).join("")}</div>
    </div>

    ${sales.some(s => s.start) ? `<h3>⏰ 开卖时间</h3><div class="card"><table>
      <tr><th>轮次</th><th>开卖时间</th><th></th></tr>
      ${sales.filter(s => s.start).sort((a, b) => a.start.localeCompare(b.start)).map(s => {
        const t = toDate(s.start), done = t < now - LIVE_MS, live = !done && t <= now;
        return `<tr class="${done ? "past" : ""}">
          <td><b>${s.news && s.url ? `<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name || "开卖")}</b>${s.code_required ? "<br><small>需要预售码</small>" : ""}</td>
          <td>${esc(fmt(s.start))}</td>
          <td style="white-space:nowrap">${done ? "已结束" : live ? '<span class="soldout">正在抢票</span>' : `<span class="pill warn" style="margin:0">${esc(countdown(t, now))}</span>`}</td></tr>`;
      }).join("")}
    </table></div>` : ""}
    ${(e.sale_evidence || []).length ? `<h3>🧾 售票状态的根据</h3><div class="card"><table class="evi">
      <tr><th>来源</th><th>内容</th><th>时间</th></tr>
      ${e.sale_evidence.map(x => `<tr><td class="meta" style="white-space:nowrap">${esc(x.src)}</td>
        <td>${x.url ? `<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">${esc(x.text)}</a>` : esc(x.text)}</td>
        <td class="meta" style="white-space:nowrap">${esc(x.time ? fmt(x.time.length === 10 ? x.time + " 00:00" : x.time, x.time.length > 10) : "")}</td></tr>`).join("")}
    </table>${e.official_text ? `<details style="margin-top:8px"><summary class="meta">官方图片上读到的文字（OCR）</summary><pre style="white-space:pre-wrap;font-size:12px;color:var(--sub)">${esc(e.official_text)}</pre></details>` : ""}</div>` : ""}
    ${(e.organizers || []).length ? `<h3>🏢 主办方</h3><div class="card">${e.organizers.map(o => {
      const p = (d.promoters || []).find(x => x.name.toLowerCase() === o.toLowerCase());
      return `<div><b>${esc(o)}</b>${p ? ` · <a href="https://www.instagram.com/${esc(p.ig)}/" target="_blank" rel="noopener">IG @${esc(p.ig)}</a> · <a href="${esc(safeUrl(p.site))}" target="_blank" rel="noopener">官网</a> <small class="meta">（已在来源登记，IG 贴文会被扫描）</small>` : ' <small class="meta">（还没在来源登记）</small>'}</div>`;
    }).join("")}</div>` : ""}
    ${newsCheckHTML((d.news_checks || {})[e.artist_name])}

    <h3>💺 座位图与票价${fee}</h3>
    <div class="card">
      ${maps.length ? `<div class="maps">${maps.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="官方座位图"></a>`).join("")}
        <div class="meta" style="margin:6px 0 12px">官方座位图（来源：${esc(e.source)}，点图可放大）</div></div>`
        : `<div class="empty">官方座位图还没公布，公布后会自动加上并通知你。</div>`}
      ${tiers.length || ocr.length ? `<table class="pricetable"><tr><th>票区</th><th style="text-align:right">价格</th></tr>
        ${tiers.map(t => `<tr><td>${esc(t.name)}${t.desc ? ` <small>· ${esc(t.desc)}</small>` : ""}${t.sold_out ? ' <span class="soldout">售罄</span>' : ""}</td><td class="price">${esc(t.price || "—")}</td></tr>`).join("")}
        ${ocr.length ? `<tr><td colspan="2" class="meta" style="background:var(--card)">🔍 以下是从官方座位图上读取的票价（自动识别，请以座位图为准）</td></tr>
          ${ocr.map(t => `<tr><td>${esc(t.name)}</td><td class="price">${esc(t.price)}</td></tr>`).join("")}` : ""}</table>`
        : e.price_text ? `<div class="note">${esc(e.price_text)}</div>`
        : e.price_from ? `<div class="note">最低 ${esc(e.price_from)} 起（详细票区请看官网）</div>`
        : `<div class="note">${maps.length ? "官方还没有用文字公布票价（目前只有座位图）。文字票价一公布，这里会自动变成价格表，并通知你。" : "票价还没公布，公布后会自动更新并通知你。"}</div>`}
    </div>

    ${Object.keys(e.notes || {}).length ? `<h3>📋 购票须知（官网原文）</h3><div class="card">${Object.entries(e.notes).map(([k, v]) =>
      `<details><summary>${esc(k)}</summary><div class="note">${esc(v)}</div></details>`).join("")}</div>` : ""}

    <h3>📣 相关消息</h3>
    <div class="list">${rel.length ? rel.slice(0, 10).map(l => `
      <a class="row" href="lead.html?id=${encodeURIComponent(l.id)}">
        ${avatar(l.avatar, l.from.replace(/^[@#]/, ""), 40)}
        <div class="body"><div class="ev" style="color:var(--ink);font-weight:600">${esc(l.title)}</div>
          <div class="info">${esc(l.kind)} · ${esc(l.from)} · ${esc(fmt(l.time) || l.first_seen)}</div></div>
        <span class="chev">›</span>
      </a>`).join("") : `<div class="card empty">目前没有 IG 或新闻提到这场演出。</div>`}</div>

    <div class="meta" style="margin-top:16px">首次发现：${esc(e.first_seen || "")} · 最后更新：${esc(d.generated_at)}</div>
    ${footer(d)}`;
}).catch(() => { nav(null, "confirmed"); fail($("#app")); });
</script>
</body>
</html>
