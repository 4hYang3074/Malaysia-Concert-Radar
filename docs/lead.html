<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>消息详情 · 马来西亚演唱会雷达</title>
<meta name="theme-color" content="#15171c">
<link rel="stylesheet" href="assets/app.css?v=20260929s">
</head>
<body>
<div class="wrap view" id="app"></div>
<script src="assets/app.js?v=20260929s"></script>
<script>
loadData(false).then(d => {
  const l = d.leads.find(x => x.id === qs("id"));
  const linked = l ? (l.matches || []).map(m => d.byId[m]).filter(Boolean) : [];
  nav(d, linked.length ? "confirmed" : "pending");
  if (!l) { location.replace("pending.html"); return; }   // 过期被清掉的消息就回列表
  document.title = `${l.title} · 马来西亚演唱会雷达`;
  $("#app").innerHTML = `
    <a class="back" href="${linked.length ? `event.html?id=${encodeURIComponent(linked[0].id)}` : "pending.html"}">‹ 返回</a>
    <div class="card" style="margin-top:6px">
      <div style="display:flex;gap:12px;align-items:center">
        ${avatar(l.avatar, l.from.replace(/^[@#]/, ""), 56)}
        <div><div style="font-weight:700">${esc(l.from)}${l.from_name ? "（" + esc(l.from_name) + "）" : ""}</div>
          <div class="meta">${esc(l.kind)} · ${esc(fmt(l.time) || l.first_seen)}</div></div>
      </div>
      <h1 style="font-size:19px">${esc(l.title)}</h1>
      ${l.artist ? `<div class="meta">关于：<a href="pending.html#a-${encodeURIComponent(l.artist)}">${esc(l.artist)}</a></div>` : ""}
      ${localUrl(l.image) ? `<img class="post-img" src="${esc(localUrl(l.image))}" alt="" onerror="this.remove()">` : ""}
      ${linked.length
        ? `<div class="banner ok">✓ 已经在售票平台上架：${linked.map(e => `<a href="event.html?id=${encodeURIComponent(e.id)}">${esc(e.artist_name)}（${platformsOf(e).map(p => esc(p.source)).join("、")}）</a>`).join("、")}</div>`
        : `<div class="banner warn">待确认：售票平台还没有对应的演出。上架后会自动移到“已确定”并通知你。</div>`}
      ${(l.platforms || []).length ? `<div class="banner ok" style="margin-top:8px">🎫 公告提到的售票平台：<b>${l.platforms.map(esc).join("、")}</b></div>` : ""}
      ${(l.hints || []).length ? `<h3>重点</h3><ul class="hints" style="font-size:14px;color:var(--ink)">${l.hints.map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
      ${l.text ? `<h3>原文</h3><div class="fulltext">${esc(l.text)}</div>` : ""}
      <a class="btn" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">打开原文 ↗</a>
      ${l.issue ? `<a class="btn ghost" href="${esc(safeUrl(l.issue))}" target="_blank" rel="noopener">这条线索的 Issue</a>` : ""}
    </div>
    ${footer(d)}`;
}).catch(() => { nav(null, "pending"); fail($("#app")); });
</script>
</body>
</html>
